[workspace]
resolver = "3"
members = ["proto", "sim", "game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
